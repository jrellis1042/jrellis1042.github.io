# Nocturnal front door — deploy config
# The repo is Git-linked to Netlify site tubular-phoenix-13e746 with
# auto-publishing on, so adding this file + netlify/functions/ deploys the
# functions on the next push. No separate functions site is needed.
[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/intake"
  to = "/.netlify/functions/intake"
  status = 200

[[redirects]]
  from = "/counts"
  to = "/.netlify/functions/counts"
  status = 200

[[redirects]]
  from = "/crm/*"
  to = "/.netlify/functions/crm/:splat"
  status = 200

[[redirects]]
  from = "/recruiter"
  to = "/.netlify/functions/recruiter"
  status = 200

[[redirects]]
  from = "/portal-auth"
  to = "/.netlify/functions/portal-auth"
  status = 200

[[redirects]]
  from = "/portal-request"
  to = "/.netlify/functions/portal-request"
  status = 200

[[redirects]]
  from = "/talent-portal"
  to = "/pages/talent-portal.html"
  status = 200

[[redirects]]
  from = "/venue-portal"
  to = "/pages/venue-portal.html"
  status = 200

[[redirects]]
  from = "/recruiter-portal-v2"
  to = "/pages/recruiter-portal-v2.html"
  status = 200

[[redirects]]
  from = "/owner-portal"
  to = "/pages/owner-portal.html"
  status = 200

[[redirects]]
  from = "/bench"
  to = "/.netlify/functions/bench-preview"
  status = 200
[[redirects]]
from = "/pages/bench-preview.html"
to = "/#bench"
status = 301

[[redirects]]
from = "/pages/bench-preview"
to = "/#bench"
status = 301

[[redirects]]
  from = "/board-data"
  to = "/.netlify/functions/board-data"
  status = 200

[[redirects]]
  from = "/crm-board"
  to = "/pages/crm-board.html"
  status = 200
