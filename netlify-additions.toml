# Front-door build — COMPLETE redirect set for cutover (merge into the
# repo-root netlify.toml; do NOT replace the live file — it already carries
# /intake, /counts, and /recruiter). Copy into netlify/functions/:
# lib.js, portal-lib.js, portal-auth.js (front-door EXTENDED version),
# portal-request.js, bench-preview.js. Copy into pages/: talent-portal.html,
# venue-portal.html, recruiter-portal-v2.html, owner-portal.html,
# bench-preview.html (all from ~/workspace/nocturnal-site/pages/).
# Required env (names only, Rashad sets values in Netlify):
# PIPEDRIVE_API_TOKEN (already set), PORTAL_SESSION_SECRET,
# OWNER_LOGIN_EMAIL. Functions need @netlify/blobs available
# (store "nocturnal-portal-auth"); without it auth fails closed.

[[redirects]]
  from = "/portal-auth"
  to = "/.netlify/functions/portal-auth"
  status = 200

[[redirects]]
  from = "/portal-request"
  to = "/.netlify/functions/portal-request"
  status = 200

[[redirects]]
  from = "/bench"
  to = "/.netlify/functions/bench-preview"
  status = 200

[[redirects]]
  from = "/talent-portal"
  to = "/pages/talent-portal.html"
  status = 200

[[redirects]]
  from = "/venue-portal"
  to = "/pages/venue-portal.html"
  status = 200

[[redirects]]
  from = "/recruiter-portal-v2"
  to = "/pages/recruiter-portal-v2.html"
  status = 200

[[redirects]]
  from = "/owner-portal"
  to = "/pages/owner-portal.html"
  status = 200
